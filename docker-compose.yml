version: "3.8"

networks:
  pet-care-network:
    driver: bridge

services:
  mysql:
    image: mysql:8.0
    container_name: pet-care-mysql
    environment:
      MYSQL_ROOT_PASSWORD: Liminghao2001
      MYSQL_DATABASE: pet-care-system
    ports:
      - "3307:3306"
    networks:
      - pet-care-network
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      interval: 10s
      timeout: 5s
      retries: 5

  backend:
    build: ./backend
    container_name: pet-care-backend
    ports:
      - "9193:9193"
    environment:
      SPRING_DATASOURCE_URL: jdbc:mysql://mysql:3306/pet-care-system?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC
      SPRING_DATASOURCE_USERNAME: root
      SPRING_DATASOURCE_PASSWORD: Liminghao2001
      SPRING_DATASOURCE_DRIVER_CLASS_NAME: com.mysql.cj.jdbc.Driver
      SPRING_JPA_HIBERNATE_DDL_AUTO: update
      SPRING_JPA_SHOW_SQL: true
      SPRING_JPA_PROPERTIES_HIBERNATE_DIALECT: org.hibernate.dialect.MySQLDialect
      SPRING_JPA_PROPERTIES_HIBERNATE_FORMAT_SQL: true
      LOGGING_LEVEL_ORG_HIBERNATE_SQL: DEBUG
      LOGGING_LEVEL_ORG_HIBERNATE_TYPE_DESCRIPTOR_SQL_BASICBINDER: TRACE
      SERVER_PORT: 9193
      AUTH_TOKEN_JWT_SECRET: 36763979244226452948404D635166546A576D5A7134743777217A25432A462D
      AUTH_TOKEN_EXPIRATION_IN_MILS: 3600000
      FRONTEND_BASE_URL: http://localhost:3000
    depends_on:
      mysql:
        condition: service_healthy
    networks:
      - pet-care-network
    restart: unless-stopped

  frontend:
    build: ./frontend
    container_name: pet-care-frontend
    ports:
      - "3000:80"
    environment:
      REACT_APP_API_BASE_URL: http://localhost:9193/api/v1
    depends_on:
      - backend
    networks:
      - pet-care-network
    restart: unless-stopped