version: '3.8'

services:
  # MySQL Database for development
  mysql-dev:
    image: mysql:8.0
    container_name: pet-care-mysql-dev
    environment:
      MYSQL_ROOT_PASSWORD: Liminghao2001
      MYSQL_DATABASE: pet-care-system
      MYSQL_USER: petcare
      MYSQL_PASSWORD: Liminghao2001
    ports:
      - "3307:3306"  # Different port to avoid conflicts
    volumes:
      - mysql_dev_data:/var/lib/mysql
    networks:
      - pet-care-dev-network
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      timeout: 20s
      retries: 10

volumes:
  mysql_dev_data:

networks:
  pet-care-dev-network:
    driver: bridge