# Docker environment configuration
spring.application.name=universal-pet-care
server.port=9192

# Database configuration - using environment variables
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:mysql://mysql:3306/pet-care-system}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:root}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:Liminghao2001}

spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect

spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.hibernate.ddl-auto=update

logging.level.org.hibernate.SQL=DEBUG
logging.level.org.hibernate.type.descriptor.sql.BasicBinder=TRACE

# App Properties
auth.token.expirationInMils=3600000
auth.token.jwtSecret=36763979244226452948404D635166546A576D5A7134743777217A25432A462D

# Frontend base URL - configurable for Docker
frontend.base.url=${FRONTEND_BASE_URL:http://localhost:3000}

# Health check endpoint
management.endpoints.web.exposure.include=health
management.endpoint.health.show-details=always