spring.application.name=universal-pet-care-test

spring.datasource.url=jdbc:h2:mem:petcare;MODE=MYSQL;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.defer-datasource-initialization=true

spring.sql.init.mode=never

auth.token.expirationInMils=3600000
auth.token.jwtSecret=dummy-secret-for-tests

frontend.base.url=http://localhost:5174
